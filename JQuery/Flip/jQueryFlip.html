
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Flip Animation - jQuery</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7fc;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .image-box {
            width: 300px;
            height: 200px;
            margin: 30px auto;
            perspective: 1000px;
        }

        #myImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 15px #aaa;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Image Flip Animation</h1>
        <p>Click the button to flip the image.</p>

        <div class="image-box">
            <img
                id="myImage"
                src="https://picsum.photos/id/1015/600/400"
                alt="Beautiful nature landscape"
            >
        </div>

        <button id="flipBtn">Flip Image</button>
    </div>

    <script>
        $(document).ready(function () {

            $("#flipBtn").click(function () {

                $("#myImage").css({
                    "transition": "transform 0.6s ease",
                    "transform": "rotateY(180deg)"
                });

                setTimeout(function () {
                    $("#myImage").css("transform", "rotateY(0deg)");
                }, 600);

            });

        });
    </script>

</body>
</html>
